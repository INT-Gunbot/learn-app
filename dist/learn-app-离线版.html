<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="学什么">
<title>学什么 · 自定义学习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235B8CFF'/%3E%3Ctext x='32' y='42' font-size='32' text-anchor='middle' fill='white' font-family='sans-serif'%3E学%3C/text%3E%3C/svg%3E">
<style>
/* ===== 基础变量 ===== */
:root {
  --bg: #0E1116;
  --bg-soft: #141922;
  --surface: #171D27;
  --surface-2: #1E2530;
  --line: #262E3B;
  --text: #E8ECF3;
  --muted: #8B96A8;
  --faint: #5C677A;
  --accent: #5B8CFF;
  --accent-2: #22C7A0;
  --gold: #F5A524;
  --bad: #FF6B6B;
  --warn: #FFB020;
  --ok: #22C7A0;
  --radius: 16px;
  --shadow: 0 8px 30px rgba(0, 0, 0, .35);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
}
[data-theme="light"] {
  --bg: #F4F6FA;
  --bg-soft: #FFFFFF;
  --surface: #FFFFFF;
  --surface-2: #F1F4F9;
  --line: #E3E8F0;
  --text: #161C26;
  --muted: #6B7688;
  --faint: #98A2B3;
  --shadow: 0 8px 24px rgba(20, 30, 50, .08);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.55;
  overscroll-behavior-y: none;
}
button { font-family: inherit; font-size: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 16px; color: var(--text); }
.hidden { display: none !important; }

/* ===== 布局 ===== */
#app { max-width: 520px; margin: 0 auto; min-height: 100%; position: relative; background: var(--bg); }
.topbar {
  position: sticky; top: 0; z-index: 30;
  padding: 14px 16px 10px; background: var(--bg);
  border-bottom: 1px solid transparent;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: .2px; }
.topbar .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.topbar .act { display: flex; gap: 8px; }
.iconbtn {
  width: 36px; height: 36px; border-radius: 12px; background: var(--surface);
  display: grid; place-items: center; font-size: 15px; color: var(--muted);
  border: 1px solid var(--line);
}
main { padding: 6px 16px calc(96px + var(--safe-b)); animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ===== 底部导航 ===== */
.tabbar {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  max-width: 520px; margin: 0 auto;
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: var(--safe-b);
}
.tabbar button {
  padding: 9px 0 8px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--faint); font-size: 11px;
}
.tabbar button .ic { font-size: 19px; line-height: 1; }
.tabbar button.on { color: var(--accent); }
.tabbar button.on .ic { transform: translateY(-1px); }

/* ===== 通用组件 ===== */
.card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
}
.row { display: flex; align-items: center; gap: 10px; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12.5px; }
.tiny { font-size: 11.5px; }
.mt8 { margin-top: 8px; } .mt12 { margin-top: 12px; } .mt16 { margin-top: 16px; }
.center { text-align: center; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px;
  border-radius: 999px; font-size: 11px; background: var(--surface-2); color: var(--muted);
  border: 1px solid var(--line);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 14px; border-radius: 12px; background: var(--surface-2);
  border: 1px solid var(--line); font-size: 14px; font-weight: 500;
}
.btn:active { transform: scale(.98); }
.btn.primary {
  background: linear-gradient(135deg, var(--accent), #7AA2FF);
  color: #fff; border: 0; font-weight: 600;
  box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
.btn.wide { width: 100%; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; padding: 7px 13px; border-radius: 999px; font-size: 13px;
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
}
.chip.on { background: color-mix(in srgb, var(--accent) 16%, var(--surface)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.bar { height: 6px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); transition: width .4s ease; }
.search {
  width: 100%; padding: 11px 14px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); outline: none; margin-bottom: 12px;
}
.search::placeholder { color: var(--faint); }
.empty { padding: 42px 20px; text-align: center; color: var(--faint); }
.empty .em { font-size: 34px; margin-bottom: 8px; }

/* ===== 首页 ===== */
.hero {
  background: linear-gradient(150deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface) 62%);
  border: 1px solid var(--line); border-radius: 20px; padding: 18px; margin-bottom: 14px;
}
.hero .big { font-size: 26px; font-weight: 800; letter-spacing: .5px; }
.hero .goal { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.ring { background: color-mix(in srgb, var(--bg) 45%, transparent); border-radius: 14px; padding: 10px 6px; text-align: center; }
.ring .num { font-size: 20px; font-weight: 700; }
.ring .lb { font-size: 11px; color: var(--muted); margin-top: 1px; }
.task {
  display: flex; align-items: center; gap: 12px; padding: 13px 14px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 10px;
}
.task .t-ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; background: var(--surface-2); }
.task .grow { flex: 1; min-width: 0; }
.task .t-title { font-weight: 600; font-size: 14.5px; }
.task .t-sub { font-size: 12px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stat-mini { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.stat-mini .n { font-size: 20px; font-weight: 700; }
.stat-mini .l { font-size: 11.5px; color: var(--muted); }

/* ===== 路径 ===== */
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; position: relative; overflow: hidden; }
.stage.done { border-color: color-mix(in srgb, var(--ok) 45%, var(--line)); }
.stage .st-head { display: flex; align-items: center; justify-content: space-between; }
.stage .st-name { font-weight: 700; font-size: 15px; }
.stage .st-goal { font-size: 12.5px; color: var(--muted); margin: 4px 0 10px; }
.stage .decks { display: flex; flex-direction: column; gap: 8px; }
.deck-line { display: flex; align-items: center; gap: 10px; }
.deck-line .nm { flex: 1; font-size: 13.5px; }
.deck-line .pc { font-size: 12px; color: var(--muted); width: 42px; text-align: right; }
.deck-line .bar { flex: none; width: 78px; }

/* ===== 知识库 ===== */
.lib-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 9px; }
.lib-item .em { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 13px; font-weight: 700; color: #fff; }
.lib-item .grow { flex: 1; min-width: 0; }
.lib-item .nm { font-weight: 600; font-size: 14px; }
.lib-item .ds { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kb-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-bottom: 9px; }
.kb-card .q { font-weight: 600; font-size: 14.5px; }
.kb-card .a { font-size: 13px; color: var(--muted); margin-top: 5px; white-space: pre-wrap; }
.kb-card .ex { font-size: 12.5px; color: var(--faint); margin-top: 6px; padding-left: 9px; border-left: 2px solid var(--line); }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.m0 { background: var(--faint); } .dot.m1 { background: var(--bad); }
.dot.m2 { background: var(--warn); } .dot.m3 { background: var(--ok); }

/* ===== 学习会话 ===== */
.study {
  position: fixed; inset: 0; z-index: 60; background: var(--bg);
  display: flex; flex-direction: column; max-width: 520px; margin: 0 auto;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + var(--safe-b));
  animation: rise .28s ease;
}
@keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
.study-top { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.study-top .bar { flex: 1; }
.stage-pill { font-size: 11.5px; color: var(--muted); }
.flipwrap { flex: 1; display: flex; flex-direction: column; }
.flip { flex: 1; perspective: 1400px; }
.flip-inner {
  position: relative; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.4,.1,.2,1);
  transform-style: preserve-3d; cursor: pointer;
}
.flip.show .flip-inner { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 20px;
  padding: 22px; display: flex; flex-direction: column; justify-content: center;
  overflow-y: auto;
}
.face.back { transform: rotateY(180deg); background: var(--surface-2); }
.face .label { font-size: 11px; letter-spacing: 1px; color: var(--faint); text-transform: uppercase; }
.face .front-text { font-size: 22px; font-weight: 700; line-height: 1.35; margin-top: 10px; }
.face .back-text { font-size: 16px; line-height: 1.7; margin-top: 8px; white-space: pre-wrap; }
.face .ex-text { font-size: 13.5px; color: var(--muted); margin-top: 12px; padding-left: 10px; border-left: 2px solid var(--accent); white-space: pre-wrap; }
.face .tap-hint { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; font-size: 11.5px; color: var(--faint); }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.grade { padding: 13px 6px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); text-align: center; font-size: 13px; }
.grade .g-em { display: block; font-size: 17px; }
.grade.g0 { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.grade.g1 { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.grade.g2 { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.grade small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.grades.hide { visibility: hidden; }
.done-wrap { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
.done-em { font-size: 52px; }
.done-wrap h2 { margin: 10px 0 4px; font-size: 22px; }
.done-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; margin: 20px 0; }

/* ===== 统计 ===== */
.heat { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 4px; overflow-x: auto; padding: 2px 0; }
.heat i { width: 12px; height: 12px; border-radius: 3px; background: var(--surface-2); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--surface-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 55%, var(--surface-2)); }
.heat i.l3 { background: var(--accent); }
.heat i.l4 { background: var(--accent-2); }
.chart { display: flex; align-items: flex-end; gap: 5px; height: 108px; margin-top: 10px; }
.chart .col { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.chart .col i { width: 100%; max-width: 20px; border-radius: 5px 5px 2px 2px; background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 40%, transparent)); min-height: 3px; }
.chart .col span { font-size: 9.5px; color: var(--faint); }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 10px; }
.legend b { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; padding: 8px; border-radius: 10px; background: var(--surface-2); font-size: 12.5px; border: 1px solid var(--line); color: var(--muted); }
.seg button.on { background: color-mix(in srgb, var(--accent) 18%, var(--surface)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }

/* ===== 弹层 ===== */
.sheet-mask { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
.sheet {
  width: 100%; max-width: 520px; background: var(--bg-soft); border-radius: 20px 20px 0 0;
  padding: 16px 16px calc(20px + var(--safe-b)); max-height: 88vh; overflow-y: auto;
  animation: up .26s cubic-bezier(.3,.1,.2,1);
}
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet h3 { margin: 0 0 12px; font-size: 17px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; }
.field input, .field textarea, .field select {
  width: 100%; padding: 11px 12px; border-radius: 12px; background: var(--surface);
  border: 1px solid var(--line); outline: none; resize: vertical;
}
.field textarea { min-height: 84px; line-height: 1.6; font-size: 15px; }
.sheet .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + var(--safe-b));
  background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
  padding: 10px 16px; border-radius: 999px; font-size: 13px; z-index: 90; box-shadow: var(--shadow);
  animation: up .2s;
}
.fileinput { display: none; }
.list-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 30px; height: 30px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--line); font-size: 16px; }
.stepper .v { min-width: 30px; text-align: center; font-weight: 600; }

</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div>
      <h1 id="pageTitle">学习</h1>
      <div class="sub" id="pageSub">今天也要进步一点点</div>
    </div>
    <div class="act">
      <button class="iconbtn" id="btnSearch" title="搜索">🔍</button>
      <button class="iconbtn" id="btnAdd" title="新增卡片">＋</button>
    </div>
  </header>

  <main id="view">
    <section id="page-home"></section>
    <section id="page-path" class="hidden"></section>
    <section id="page-lib" class="hidden"></section>
    <section id="page-stats" class="hidden"></section>
    <section id="page-me" class="hidden"></section>
  </main>

  <nav class="tabbar">
    <button data-page="home" class="on"><span class="ic">🏠</span>学习</button>
    <button data-page="path"><span class="ic">🧭</span>路径</button>
    <button data-page="lib"><span class="ic">📚</span>知识库</button>
    <button data-page="stats"><span class="ic">📊</span>统计</button>
    <button data-page="me"><span class="ic">⚙️</span>我的</button>
  </nav>
</div>

<div id="studyRoot"></div>
<div id="sheetRoot"></div>
<input type="file" id="fileInput" class="fileinput" accept=".json,.md,.markdown,.txt,.csv,.tsv">

<script>
/* 内置知识库：英语（职场 / 产品经理场景导向）
 * card: { f: 正面（词语或问题）, b: 背面（释义与要点）, t: 例句或补充 }
 */
window.KB_ENGLISH = {
  id: "english",
  name: "英语",
  subtitle: "职场与产品场景英语",
  icon: "EN",
  accent: "#5B8CFF",
  decks: [
    {
      id: "en-vocab",
      name: "高频核心词汇",
      desc: "外企 / 跨境团队邮件与会议里真正高频的 30 个词",
      cards: [
        { f: "leverage", b: "v. 利用、撬动（资源、优势以放大结果）。比 use 更强调「以小博大」。搭配：leverage A to do B。", t: "We leveraged existing user data to train the recommendation model." },
        { f: "prioritize", b: "v. 排定优先顺序；n. priority 优先级。搭配：prioritize A over B。", t: "We need to prioritize retention over acquisition this quarter." },
        { f: "align / alignment", b: "v. 对齐；n. 一致性。搭配：align A with B；get everyone aligned on + 目标。", t: "Let us align on the success metric before we start building." },
        { f: "scope", b: "n. 范围；v. 界定范围。in / out of scope 表示纳入或排除；scope creep 指范围蔓延。", t: "Push notifications are out of scope for version one." },
        { f: "trade-off", b: "n. 权衡取舍。指无法同时最优时明确的取舍，必须说清放弃了什么。搭配：a trade-off between A and B。", t: "There is a trade-off between response speed and accuracy." },
        { f: "bottleneck", b: "n. 瓶颈，限制整体效率的关键环节。搭配：identify / remove a bottleneck。", t: "Manual review is the bottleneck in our content pipeline." },
        { f: "stakeholder", b: "n. 利益相关方，会影响项目或被项目影响的人。key stakeholders 指核心相关方。", t: "Keep all stakeholders in the loop before the launch." },
        { f: "deliverable", b: "n. 交付物，项目承诺产出的具体成果（文档、功能、报告）。", t: "The deliverables for this sprint are the PRD and the clickable prototype." },
        { f: "milestone", b: "n. 里程碑，标志阶段完成的关键节点，用于进度管理与向上汇报。", t: "The beta release is our next major milestone." },
        { f: "iterate / iteration", b: "v. 迭代；n. 一次迭代。指小步快跑、基于反馈持续改进，而非一次做完美。", t: "We will iterate on the onboarding flow based on user feedback." },
        { f: "robust", b: "adj. 稳健的、健壮的。指系统在异常输入或高压下仍能正常工作。", t: "We need a more robust error handling mechanism." },
        { f: "scalable / scalability", b: "adj. 可扩展的。指用户或数据量增长时，性能与成本仍然可控。", t: "Is this architecture scalable to ten million users?" },
        { f: "validate", b: "v. 验证（用证据检验假设是否成立）。搭配：validate an assumption / a hypothesis。", t: "We validated the hypothesis with a two-week A/B test." },
        { f: "mitigate", b: "v. 缓解、降低（风险）。目标是降低发生概率或影响程度，而非完全消除。", t: "We added a fallback path to mitigate hallucination risks." },

      cards: [
        { f: "需求采集的四个来源", b: "用户反馈（客服/应用商店/社群）、数据（行为漏斗与流失）、业务方（销售/运营/老板）、行业与技术趋势。四类都要有，偏食会导致失真。", t: "只听销售做 B 端，会变成「大客户定制机」，产品无法复用。" },
        { f: "需求池怎么管", b: "统一入口、标准字段（来源/场景/预估价值/成本/状态）、定期评审、明确「暂不做」也要记录理由。需求池的价值在于可追溯，不在于堆量。", t: "每条需求都要留「是谁、在什么场景、因为什么提出」，否则半年后无法判断。" },
        { f: "RICE 优先级模型", b: "Reach（影响人数）× Impact（单人次影响程度）× Confidence（信心）/ Effort（工作量）。适合做季度级排序，能量化对比不同性质的需求。", t: "影响 10 万人、每人提升 2%、信心 80%、需 2 人月，可与另一个需求直接算分对比。" },
        { f: "MoSCoW 优先级", b: "Must（不做就失败）/ Should（重要但可延后）/ Could（锦上添花）/ Won't（本次明确不做）。适合版本范围内的快速收敛。", t: "上线前一周用 MoSCoW 裁剪范围，比无休止争论高效。" },
        { f: "KANO 与优先级结合", b: "基本型需求优先兜底（不做会流失），期望型做 ROI 排序，兴奋型用小成本低风险方式试。不要拿基本型需求去做亮点宣传。", t: "「系统不卡顿」是基本型，宣传它等于承认之前很卡。" },
        { f: "如何识别伪需求", b: "三问：用户说的时候有没有真实场景？他现在用什么替代方案、为此付出多少成本？如果免费提供他会改变行为吗？看行为，不看表态。", t: "问卷里 80% 说想要，上线后 3% 使用 —— 典型表态与行为背离。" },
        { f: "需求评审要看什么", b: "看五件事：目标是否清晰、场景是否具体、边界是否穷举（异常/空态/权限/并发）、指标是否可测、依赖是否识别。", t: "评审中最有价值的问题往往是「这个字段为空时显示什么」。" },
        { f: "范围蔓延 scope creep", b: "开发中不断插入新需求导致延期与质量下降。治理方法：冻结窗口 + 变更必须换出等价工作量 + 变更留痕。", t: "「顺手加一个小功能」积累三次，就吃掉一个版本的测试时间。" },
        { f: "BRD / MRD / PRD 的区别", b: "BRD 讲商业价值（为什么值得投钱）、MRD 讲市场与用户（机会在哪）、PRD 讲实现方案（具体怎么做）。面向的对象分别是决策层、市场与产品、研发与设计。", t: "向上汇报要 BRD 的逻辑，给研发要 PRD 的细节。" },
        { f: "用户故事与 INVEST 原则", b: "格式：作为【角色】，我希望【动作】，以便【价值】。好的故事满足 Independent、Negotiable、Valuable、Estimable、Small、Testable。", t: "「作为新用户，我希望能一键导入通讯录，以便快速找到好友」。" },
        { f: "验收标准 AC 怎么写", b: "用可判定的条件描述：给定什么前提、执行什么操作、预期什么结果，含异常分支。AC 是研发与测试的共同依据。", t: "弱 AC：导入要快。强 AC：500 条联系人导入 3 秒内完成，失败时提示并可重试。" },
        { f: "需求分级 P0-P3", b: "P0 阻塞上线或严重影响核心；P1 重要但有替代方案；P2 体验优化；P3 长期设想。分级只在具体版本语境下有意义。", t: "「这是 P0」必须配一句「因为它阻塞了 30% 用户的下单路径」。" },
        { f: "技术可行性与成本的沟通", b: "不要问「能不能做」，要问「做这件事的代价是什么、有没有更便宜的替代路径、技术债有多重」。让研发给出方案选项而非简单 yes/no。", t: "实时同步要 6 人月；改为「手动刷新 + 智能提示」只需 1 人月，能覆盖 90% 场景。" },
        { f: "需求追溯", b: "建立「目标 → 需求 → 功能 → 指标」的链路，任何一个功能都能回答它服务于哪个目标；上线后能回溯当初的假设是否成立。", t: "季度复盘时，追溯能帮你看清哪些投入是纯沉没成本。" }
      ]
    },
    {
      id: "pm-research",
      name: "用户研究",
      desc: "在不确定性中找到真实答案",
      cards: [
        { f: "定性研究与定量研究", b: "定性（访谈、观察）回答「为什么」，样本小但能发现未知问题；定量（数据、问卷）回答「有多少、是谁」，能验证规模。先定性发现，再定量验证。", t: "访谈发现「用户不知道能导出」，再看数据确认有多少人卡在这一步。" },
        { f: "用户访谈的关键技巧", b: "问事实与经历而非观点与预测（你上次是怎么做的，而不是你会怎么做）；不引导、不解释产品；多追问「然后呢」「当时为什么」；让对方讲故事。", t: "差问题：你会用这个功能吗？好问题：上次你要把数据发给同事，是怎么做的？" },
        { f: "问卷设计的坑", b: "避免引导性措辞与双重问题、避免让用户预测未来、选项要穷尽且互斥、控制长度（不超过 5 分钟）、先小样本试填。", t: "「您是否喜欢我们优秀的新功能？」是典型引导式提问，数据毫无价值。" },
        { f: "用户画像 Persona", b: "基于真实研究抽象出的典型用户模型，包含目标、场景、行为特征与痛点。价值在于让团队讨论「同一个用户」，而不是各说各话。", t: "错误做法：凭想象编一个「25 岁白领小李」，没有任何数据支撑。" },
        { f: "用户旅程地图", b: "按阶段拆解用户从认知到忠诚的全流程，标注每阶段的动作、触点、情绪与痛点，找出体验断点与机会点。", t: "画完常发现最大流失不在产品内，而在「注册后收到一封看不懂的邮件」。" },
        { f: "可用性测试", b: "让真实用户用原型完成真实任务，观察卡点而非听评价。5 个用户通常能发现大部分主要问题；任务设计要中立，不提示操作路径。", t: "给出任务「把本月报告发给同事」，然后闭嘴观察，不要说「你可以点右上角」。" },
        { f: "数据告诉你要不要做，访谈告诉你为什么", b: "数据能定位「在哪流失」，但不能解释「为什么流失」；访谈能解释原因，但不能说明规模。两者互补，缺一会导致误判。", t: "数据显示某按钮点击低，访谈发现是因为文案用了内部术语，用户看不懂。" },
        { f: "同理心地图", b: "围绕一个用户，梳理他「看到/听到/想到/说到/做到」的内容，以及痛点与收益。适合快速对齐团队对用户的理解。", t: "常用于工作坊开场，30 分钟就能暴露团队认知差异。" },
        { f: "焦点小组的局限", b: "群体环境易被意见领袖带偏、社会赞许效应让人说场面话，不适合探索个人真实行为。适合概念刺激与共创，不适合验证需求真实性。", t: "想要真实的个人使用动机，一对一访谈远优于焦点小组。" },
        { f: "流失用户访谈的价值", b: "留存用户会告诉你如何更好，流失用户会告诉你为什么失败。重点问：什么时候开始不用的、当时发生了什么、现在用什么替代、什么能让你回来。", t: "流失访谈常发现的决定性因素，是产品内数据完全看不到的外部事件。" },
        { f: "NPS 净推荐值", b: "用「多大可能推荐给朋友」0-10 分衡量，推荐者减贬损者的占比。适合做长期趋势监测，不宜作为唯一目标（容易被运营动作污染）。", t: "NPS 上升但留存没变，说明可能只是调研样本变了，而非体验变好。" },
        { f: "用户反馈闭环", b: "建立「收集 → 分级 → 归因 → 处理 → 回复用户 → 复盘」的闭环，并公开处理进度。闭环本身就能提升用户满意度。", t: "哪怕回复「已记录，暂不计划支持，原因是……」，也远好过石沉大海。" }
      ]
    },
    {
      id: "pm-metric",
      name: "数据与指标体系",
      desc: "用数据做判断，而不是做装饰",
      cards: [
        { f: "北极星指标", b: "唯一能代表产品核心价值的指标，同时反映用户获得的价值与公司获得的收益。它应随产品阶段演进，并用来对齐全团队。", t: "搜索产品的北极星可能是「有效搜索次数」，而非注册用户数。" },
        { f: "指标体系分层", b: "分三层：结果指标（北极星与业务结果）、过程指标（驱动结果的关键行为）、健康指标（性能、投诉、成本等底线）。只看结果会滞后，只看过程会跑偏。", t: "GMV 是结果，加购率是过程，崩溃率是健康指标。" },
        { f: "AARRR 漏斗", b: "获客 → 激活 → 留存 → 收入 → 推荐。用于定位增长瓶颈在哪一环，并据此分配资源；不同阶段的产品重点不同。", t: "激活率低时砸钱获客，等于把水倒进漏桶。" },
        { f: "埋点与事件模型", b: "事件 = 谁（用户标识）+ 在何时 + 做了什么（事件名）+ 附加属性。设计要点：命名规范统一、属性完整、先有指标再有埋点。", t: "错误做法：先把能埋的都埋了，之后发现关键问题没有对应字段。" },
        { f: "活跃的定义：DAU / WAU / MAU", b: "必须自己定义「活跃」的行为标准（如当日产生一次核心行为），否则数字不可比。DAU/MAU 衡量粘性，比值越高说明用户越习惯使用。", t: "把「打开 App」算活跃，会让营销推送的效果被严重高估。" },
        { f: "留存曲线与留存率", b: "留存率指某日新增用户在第 N 日仍活跃的比例。看曲线是否走平：走平说明产品留住了核心用户，是 PMF 的强信号。", t: "次日留存 40%、7 日 20%、30 日 18% —— 说明 7 日后曲线走平，核心用户留下了。" },
        { f: "漏斗分析怎么做", b: "定义步骤 → 统一口径 → 看整体转化率与分步流失 → 分群对比（渠道/版本/用户类型）→ 定位最大流失步 → 形成假设并实验。", t: "整体转化率下降 5%，拆分后发现只发生在某个安卓机型上。" },
        { f: "A/B 实验基本流程", b: "形成假设 → 确定指标（一个主指标 + 若干护栏指标）→ 计算样本量 → 随机分流 → 跑够周期（覆盖完整周内波动）→ 检验显著性 → 决策全量或回滚。", t: "只跑 3 天就下结论，往往把周末效应当成实验效果。" },
        { f: "统计显著性与样本量", b: "p 值衡量「观察到的差异由随机波动导致的概率」，样本越小越容易得出不稳定结论。样本量由基线转化率、最小可检测提升、显著性水平与统计功效共同决定。", t: "基线转化 1%、想检测 10% 相对提升，通常需要几十万级样本，小流量产品应考虑改用定性验证。" },
        { f: "辛普森悖论", b: "分组看都是 A 更好，合并后 B 更好（或相反）。原因是各组的构成比例不同。解决办法：先分层看，再做加权或标准化。", t: "新版本整体转化更高，只是因为它被分配到了更多高活跃渠道上。" },
        { f: "相关性不等于因果", b: "两件事同时发生不代表存在因果。确认因果需满足时间先后、排除混杂变量、最好有实验或自然实验佐证。", t: "付费用户留存更高，可能是「高意愿用户本来就更容易付费」，而不是付费导致留存。" },
        { f: "同期群分析 Cohort", b: "按用户进入时间或行为分组，追踪各组随时间的表现，能剥离「用户结构变化」带来的假象，是判断改版是否真的有效的利器。", t: "整体留存上升，可能是新用户质量变好；分同期群看老用户反而下降。" },
        { f: "数据口径与校验", b: "任何数字都要先问：定义是什么、统计窗口是什么、去重规则是什么、与谁对齐。上线后必须做埋点校验（抓包 + 抽样比对）。", t: "运营和产品的「活跃用户」差 30%，多半是去重口径不同，而非真有问题。" },
        { f: "RFM 用户分层", b: "按最近一次消费（Recency）、消费频次（Frequency）、消费金额（Monetary）给用户分层，针对不同层采取不同策略（召回、提频、提客单）。", t: "重要保持客户做权益，重要挽留客户做定向召回，一般发展客户做首单转化。" }
      ]
    },
    {
      id: "pm-biz",
      name: "商业与增长",
      desc: "让产品活下来并长大",
      cards: [
        { f: "商业模式画布", b: "九个模块：客户细分、价值主张、渠道、客户关系、收入来源、核心资源、关键活动、合作伙伴、成本结构。用一页纸说清生意如何成立。", t: "用它做竞品拆解，能快速看出对手真正的成本大头在哪。" },
        { f: "常见收入模型", b: "订阅制（可预测现金流）、交易抽成（随规模放大）、广告（变现流量）、增值服务（免费 + 付费升级）、授权与 API（技术变现）。选择取决于价值交付方式。", t: "工具型产品适合订阅；低频高客单价的交易适合抽成。" },
        { f: "LTV / CAC 与 LTV:CAC", b: "LTV 是用户生命周期总价值，CAC 是获客成本。健康比例通常认为应在 3 倍以上，过高说明获客投入不足，过低说明烧钱换增长。", t: "CAC 200 元、月均贡献 30 元、平均留存 20 个月 → LTV 600 元，比值 3。" },
        { f: "单位经济模型", b: "不看总量看单体：单个用户（或单笔订单）的收入减去其全部变动成本是否为正、多久回本。总量增长掩盖单体亏损是最危险的陷阱。", t: "每单毛利 -5 元时，订单越多亏得越多，规模效应救不了错误的模型。" },
        { f: "增长飞轮", b: "找到一个能自我强化的闭环：更多用户 → 更多数据/内容/供给 → 更好体验 → 更多用户。关键是找出你的飞轮第一推动力。", t: "内容社区飞轮：内容多 → 留存好 → 创作者多 → 内容更多。" },
        { f: "Aha moment 与魔法数字", b: "Aha moment 是用户第一次感受到核心价值的时刻；魔法数字是达成后留存显著提升的行为阈值。产品设计的目标是把用户尽早推到这一刻。", t: "某协作产品发现：一周内邀请 3 名同事的团队，留存远高于其他用户。" },
        { f: "渠道与获客成本", b: "渠道分付费、自有、自然与口碑。评估不能只看 CAC，还要看用户质量（留存与 LTV）与可扩展性。渠道会衰减，需持续测试新渠道。", t: "某渠道 CAC 最低，但 30 日留存只有主流渠道的三分之一，实际并不便宜。" },
        { f: "病毒系数 K factor", b: "K = 每个用户带来的新用户数。K>1 才会自增长，实际中几乎不可持续，因此更重要的是缩短病毒循环周期、提高邀请转化。", t: "K=0.6 但循环周期只有 2 天，增长仍可能快于 K=0.9 而周期 30 天的产品。" },
        { f: "定价策略", b: "三类：成本加成、竞争对标、价值定价。软件优先价值定价（按用户感知价值与替代方案定价），并用套餐分级做价格歧视。", t: "按「帮客户省了多少人力成本」定价，往往远高于按功能数量定价。" },
        { f: "免费增值 Freemium", b: "免费层负责获客与习惯养成，付费层负责变现。关键设计是「免费层的天花板」要卡在用户真正产生依赖之后。", t: "免费版限制协作人数，个人用足够，团队协作就必须付费。" },
        { f: "流失与召回", b: "先定义流失（多久未产生核心行为），再分可召回与不可召回，用不同触达手段（push/短信/邮件/人工）。召回成功率远低于预防成本。", t: "对 30 天未活跃用户发「你的数据还在」类提醒，效果通常好于纯优惠。" },
        { f: "TAM / SAM / SOM", b: "TAM 总潜在市场、SAM 可服务市场、SOM 可获取市场。用于论证市场空间与制定目标，避免用 TAM 冒充自己的目标。", t: "对外讲 TAM 讲故事，对内定目标看 SOM。" }
      ]
    },
    {
      id: "pm-collab",
      name: "项目推进与协作",
      desc: "把方案真正落地",
      cards: [
        { f: "敏捷 vs 瀑布", b: "瀑布适合需求稳定、变更成本极高的场景；敏捷适合需求不确定、需要快速验证的场景。选型依据是「需求不确定性」与「变更成本」。", t: "合规系统改造适合瀑布式阶段验收；C 端增长实验适合两周一个迭代。" },
        { f: "Sprint 与看板", b: "Sprint 是固定周期的迭代（含计划、开发、评审、复盘）；看板强调限制在制品数量、拉动式流动。前者适合节奏明确，后者适合支持类突发工作。", t: "运维支持团队用看板常比强行套 Sprint 更高效。" },
        { f: "每日站会的目的", b: "同步阻塞与调整计划，不是汇报进度。三句话：昨天做了什么、今天做什么、有什么阻塞。超 15 分钟通常说明问题被带进了会议。", t: "站会上暴露「等设计稿」的阻塞，会后立刻解决，才是站会的价值。" },
        { f: "版本管理与灰度发布", b: "用灰度（按用户/比例/地域逐步放量）+ 开关 + 监控 + 回滚预案控制风险。放量节奏与观察指标必须提前定义。", t: "先 1% 观察崩溃率与核心转化，24 小时无异常再放量到 10%。" },
        { f: "RACI 责任矩阵", b: "区分 Responsible（执行）、Accountable（最终负责，唯一）、Consulted（被咨询）、Informed（被知会）。Accountable 只能有一个，否则就是无人负责。", t: "需求评审会上没有 Accountable，会导致谁都能改需求、谁都不担结果。" },
        { f: "与研发 / 设计 / 运营的协作边界", b: "PM 负责目标与取舍，研发负责实现与技术方案，设计负责体验与交互，运营负责触达与增长。跨界要提建议而非替对方决策。", t: "PM 可以说「这个页面 3 秒加载不可接受」，但不必规定用哪种缓存方案。" },
        { f: "上线 Checklist", b: "至少覆盖：功能回归、数据与埋点校验、性能与兼容、文案与法务合规、客服话术与帮助文档、监控告警、回滚方案、相关方通知。", t: "最常漏的两项：埋点没校验、客服不知道新功能上线了。" },
        { f: "复盘怎么做", b: "对事不对人，按「目标 → 结果 → 差异 → 原因 → 下次怎么做」推进，产出必须是可执行的动作项并跟踪落地。", t: "复盘结论是「下次排期前先做技术可行性评估」，而不是「大家要更重视排期」。" },
        { f: "排期与关键路径", b: "找出决定总工期的最长依赖链（关键路径），优先保障其资源；并行任务间的接口与联调时间必须显式留出。", t: "前后端并行开发 5 天，但联调只留半天，是典型的排期失误。" },
        { f: "向上沟通与汇报", b: "结论先行，先说结果与判断，再说依据；给选项而非只给问题；同步风险要早且带方案。汇报的目的是帮对方做决策。", t: "差：遇到了很多问题。好：上线大概率延期 3 天，建议砍掉 X 保主流程，需要你确认。" }
      ]
    },
    {
      id: "pm-ai",
      name: "AI 产品",
      desc: "概率性输出带来的新方法论",
      cards: [
        { f: "AI 产品与传统产品的根本差异", b: "传统软件是确定性逻辑（输入 A 必得 B），AI 产品是概率性输出（同样输入可能不同结果）。因此不能用写死规则的思路做 AI 产品，必须围绕「不确定性」设计。", t: "传统：点按钮弹窗。AI：生成结果可能好可能坏，需要评估、兜底与用户纠偏通道。" },
        { f: "提示词与上下文工程", b: "把模型当成一个「能力很强但没有背景信息的新同事」：给足角色、任务、约束、示例与数据。上下文的质量决定输出质量的上限。", t: "加「你是资深客服，只依据以下知识库回答，不确定的内容必须说不知道」，能显著降低瞎编率。" },
        { f: "RAG 检索增强生成", b: "先从知识库中检索相关片段，再让模型基于片段作答。核心价值：降低幻觉、可溯源、知识更新无需重训。关键在切分策略与召回质量。", t: "RAG 效果差时，八成问题出在文档切分与检索排序，而不是模型不够强。" },
        { f: "Agent 与工作流编排", b: "Agent = 模型 + 工具 + 记忆 + 规划。设计原则：能用固定流程解决的不要交给自主规划，越自主越难控质量与成本。", t: "报销审核适合固定流程 + 关键节点模型判断，不适合完全自主 Agent。" },
        { f: "幻觉与可控性治理", b: "手段包括：限定知识源与拒答机制、引用溯源、结构化输出 + 校验、关键场景人工复核、低置信度降级。先定义「错不起的场景」再上治理。", t: "医疗、金融、法务建议类场景必须有人审环节与明确免责。" },
        { f: "AI 效果怎么评估", b: "三层：离线评测集（固定题目批量跑分，用于快速迭代）、人工抽检（主观质量）、在线指标（解决率、采纳率、转人工率、留存）。三者缺一不可。", t: "只用人工感受判断「变好了」，很容易被样例选择偏差误导。" },
        { f: "成本、延迟与效果的三角", b: "更强的模型通常更贵更慢。工程手段：分级路由（简单问题走小模型）、缓存、流式输出降低感知延迟、批处理降本。", t: "先用小模型做意图分类与筛选，只有 10% 的复杂请求走大模型，成本可大幅下降。" },
        { f: "模型选型", b: "通用大模型（能力全、成本较高）、微调（稳定特定格式与风格，需数据与维护成本）、小模型（便宜快，适合垂直固定任务）、多模态（理解图像/语音）。先明确任务再选模型。", t: "固定格式的意图分类，微调小模型往往比直接调大模型更稳更便宜。" },
        { f: "人机协同设计", b: "把 AI 定位为「助手」而非「替代」：提供草稿而非终稿、提供建议而非决策、保留一键修改与反馈入口。用户纠错的数据正是迭代燃料。", t: "AI 生成客服回复 → 人工确认后发送 → 修改记录回流为优化样本。" },
        { f: "数据飞轮与冷启动", b: "用户使用产生数据 → 数据优化模型与知识库 → 体验变好 → 更多使用。冷启动期可用人工标注、公开数据、规则兜底先把体验拉过及格线。", t: "早期用人工整理的 FAQ + 规则匹配兜底，积累真实问题后再上模型。" },
        { f: "AI 产品的专属指标", b: "除通用留存外，还应看：首答解决率、结果采纳率/编辑率、转人工率、任务完成时长、单次成本、拒答率。其中「采纳率」最能反映真实价值。", t: "生成内容被用户原样采用的比例低于 30%，说明功能实际价值有限。" },
        { f: "AI 合规与伦理", b: "关注数据隐私与授权、训练数据来源与版权、内容安全与审核、算法公平与可解释、用户知情权（是否告知由 AI 生成）。这些是上线前置条件，不是补丁。", t: "用户上传的文档是否用于训练，必须在协议中明确并提供开关。" }
      ]
    }
  ]
};

</script>
<script>
/* 存储层：数据模型 / 间隔重复调度 / 统计 / 导入导出 */
(function () {
  "use strict";

  var KEY = "learnapp.v1";
  var DAY = 86400000;

  /* ---------- 学习路径（阶段 → deck） ---------- */
  var PATHS = {
    english: [
      { name: "阶段一 · 词汇地基", goal: "掌握职场高频词，能读懂英文邮件与文档", decks: ["en-vocab"] },
      { name: "阶段二 · 地道表达", goal: "开会与邮件中听懂、用对高频短语", decks: ["en-phrase"] },
      { name: "阶段三 · 精准语法", goal: "写作不踩常见语法坑", decks: ["en-grammar"] },
      { name: "阶段四 · 表达升级", goal: "把普通英文改写成专业英文", decks: ["en-polish"] }
    ],
    pm: [
      { name: "阶段一 · 产品认知", goal: "建立判断需求与方案价值的底层框架", decks: ["pm-basic"] },
      { name: "阶段二 · 需求与用户", goal: "把杂乱需求变成有序决策，学会做研究", decks: ["pm-req", "pm-research"] },
      { name: "阶段三 · 数据与实验", goal: "用指标和 A/B 实验验证判断", decks: ["pm-metric"] },
      { name: "阶段四 · 商业与增长", goal: "理解钱怎么赚、用户怎么长", decks: ["pm-biz"] },
      { name: "阶段五 · 落地与 AI", goal: "把方案推进上线，理解 AI 产品方法论", decks: ["pm-collab", "pm-ai"] }
    ]
  };

  /* ---------- 状态 ---------- */
  var state = null;
  var index = { cards: [], byId: {}, byDeck: {}, decks: [], domains: [] };

  function defaultState() {
    return {
      version: 1,
      settings: { theme: "dark", dailyNew: 10, dailyReview: 40, activeDomain: "english" },
      progress: {},
      stats: {},
      customDomains: [],
      customDecks: [],
      custom: [],
      createdAt: Date.now()
    };
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      state = raw ? JSON.parse(raw) : defaultState();
    } catch (e) {
      state = defaultState();
    }
    if (!state.settings) state.settings = defaultState().settings;
    if (!state.progress) state.progress = {};
    if (!state.stats) state.stats = {};
    if (!state.custom) state.custom = [];
    if (!state.customDecks) state.customDecks = [];
    if (!state.customDomains) state.customDomains = [];
    buildIndex();
    return state;
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("保存失败", e);
    }
  }

  /* ---------- 索引 ---------- */
  function buildIndex() {
    index = { cards: [], byId: {}, byDeck: {}, decks: [], domains: [] };
    var domains = [window.KB_ENGLISH, window.KB_PM];
    domains.forEach(function (d) {
      index.domains.push({ id: d.id, name: d.name, subtitle: d.subtitle, icon: d.icon, accent: d.accent, builtin: true });
      d.decks.forEach(function (deck) {
        index.decks.push({ id: deck.id, domainId: d.id, name: deck.name, desc: deck.desc, domainName: d.name, accent: d.accent, builtin: true });
        index.byDeck[deck.id] = [];
        deck.cards.forEach(function (c, i) {
          var card = {
            id: d.id + ":" + deck.id + ":" + i,
            f: c.f, b: c.b, t: c.t || "",
            deckId: deck.id, domainId: d.id, domainName: d.name, deckName: deck.name,
            builtin: true
          };
          index.cards.push(card);
          index.byId[card.id] = card;
          index.byDeck[deck.id].push(card);
        });
      });
    });
    // 自定义领域（用户新建的）
    (state.customDomains || []).forEach(function (d) {
      if (index.domains.some(function (x) { return x.id === d.id; })) return;
      index.domains.push({ id: d.id, name: d.name, subtitle: "自定义", icon: d.icon || "MY", accent: "#F5A524", builtin: false });
    });
    // 兼容：早期版本只有 customDecks 的情况
    (state.customDecks || []).forEach(function (d) {
      if (index.domains.some(function (x) { return x.id === d.domainId; })) return;
      index.domains.push({ id: d.domainId, name: d.domainName || "我的知识库", subtitle: "自定义", icon: "MY", accent: "#F5A524", builtin: false });
    });
    (state.customDecks || []).forEach(function (deck) {
      index.decks.push({ id: deck.id, domainId: deck.domainId, name: deck.name, desc: deck.desc || "", domainName: deck.domainName || "我的知识库", accent: "#F5A524", builtin: false });
      index.byDeck[deck.id] = [];
    });
    (state.custom || []).forEach(function (c) {
      var card = {
        id: c.id, f: c.f, b: c.b || "", t: c.t || "",
        deckId: c.deckId, domainId: c.domainId, domainName: c.domainName || "我的知识库",
        deckName: (index.decks.find(function (d) { return d.id === c.deckId; }) || {}).name || "未分组",
        builtin: false
      };
      index.cards.push(card);
      index.byId[card.id] = card;
      if (!index.byDeck[card.deckId]) index.byDeck[card.deckId] = [];
      index.byDeck[card.deckId].push(card);
    });
  }

  /* ---------- 日期 ---------- */
  function dayKey(ts) {
    var d = ts === undefined ? new Date() : new Date(ts);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }

  function todayKey() { return dayKey(Date.now()); }

  /* ---------- SRS ---------- */
  function getProgress(id) {
    return state.progress[id] || null;
  }

  // 掌握度：0 未学 1 学习中 2 巩固中 3 已掌握
  function mastery(id) {
    var p = state.progress[id];
    if (!p) return 0;
    if (p.i >= 21) return 3;
    if (p.i >= 7) return 2;
    return 1;
  }

  // grade: 0 忘记 1 模糊 2 掌握
  function review(id, grade) {
    var now = Date.now();
    var p = state.progress[id] || { e: 2.5, i: 0, r: 0, l: 0, due: 0 };
    var before = mastery(id);
    if (grade === 0) {
      p.l++;
      p.r = 0;
      p.i = 0;
      p.due = now + 10 * 60 * 1000; // 10 分钟后再来
      p.e = Math.max(1.3, p.e - 0.2);
    } else if (grade === 1) {
      p.r++;
      p.i = p.i === 0 ? 1 : Math.max(1, Math.round(p.i * 1.3));
      p.e = Math.max(1.3, p.e - 0.05);
      p.due = now + p.i * DAY;
    } else {
      p.r++;
      if (p.i === 0) p.i = 1;
      else if (p.i < 3) p.i = 3;
      else p.i = Math.round(p.i * p.e);
      p.e = Math.min(2.8, p.e + 0.05);
      p.due = now + p.i * DAY;
    }
    p.last = now;
    state.progress[id] = p;

    var k = todayKey();
    var s = state.stats[k] || { n: 0, rv: 0, ms: 0 };
    if (before === 0) s.n++;   // 首次接触：计入新学
    else s.rv++;               // 再次出现：计入复习
    state.stats[k] = s;
    save();
    return p;
  }

  function addStudyTime(ms) {
    var k = todayKey();
    var s = state.stats[k] || { n: 0, rv: 0, ms: 0 };
    s.ms += ms;
    state.stats[k] = s;
  }

  function dueCards(limit) {
    var now = Date.now();
    var list = index.cards.filter(function (c) {
      var p = state.progress[c.id];
      return p && p.due && p.due <= now;
    });
    list.sort(function (a, b) { return state.progress[a.id].due - state.progress[b.id].due; });
    return limit ? list.slice(0, limit) : list;
  }

  function newCards(domainId, limit) {
    var pool = index.cards.filter(function (c) {
      if (domainId && c.domainId !== domainId) return false;
      return !state.progress[c.id];
    });
    // 按学习路径顺序
    var order = pathDeckOrder(domainId);
    pool.sort(function (a, b) {
      var oa = order.indexOf(a.deckId), ob = order.indexOf(b.deckId);
      oa = oa < 0 ? 99 : oa; ob = ob < 0 ? 99 : ob;
      return oa - ob;
    });
    return limit ? pool.slice(0, limit) : pool;
  }

  function pathDeckOrder(domainId) {
    var out = [];
    (PATHS[domainId] || []).forEach(function (st) { st.decks.forEach(function (d) { out.push(d); }); });
    // 不在路径中的 deck 追加在最后
    index.decks.forEach(function (d) {
      if (d.domainId === domainId && out.indexOf(d.id) < 0) out.push(d.id);
    });
    return out;
  }

  function todayStat() {
    return state.stats[todayKey()] || { n: 0, rv: 0, ms: 0 };
  }

  function streak() {
    var n = 0;
    var d = new Date();
    // 今天没学不算断，从今天往前找
    for (var i = 0; i < 400; i++) {
      var k = dayKey(d.getTime());
      var s = state.stats[k];
      var active = s && (s.n + s.rv) > 0;
      if (active) n++;
      else if (i > 0) break;
      else if (!active && i === 0) { /* 今天未学，继续看昨天 */ }
      d.setDate(d.getDate() - 1);
    }
    return n;
  }

  function masteryDist(domainId) {
    var dist = [0, 0, 0, 0];
    index.cards.forEach(function (c) {
      if (domainId && c.domainId !== domainId) return;
      dist[mastery(c.id)]++;
    });
    return dist;
  }

  function deckMastery(deckId) {
    var cards = index.byDeck[deckId] || [];
    if (!cards.length) return { learned: 0, total: 0, pct: 0, avg: 0 };
    var learned = 0, sum = 0;
    cards.forEach(function (c) {
      var m = mastery(c.id);
      if (m > 0) learned++;
      sum += m;
    });
    return { learned: learned, total: cards.length, pct: Math.round((learned / cards.length) * 100), avg: sum / cards.length };
  }

  /* ---------- 自定义卡片 ---------- */
  function uid(prefix) {
    return (prefix || "c") + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function addCard(data) {
    var card = {
      id: uid("c"), f: data.f, b: data.b || "", t: data.t || "",
      deckId: data.deckId, domainId: data.domainId, domainName: data.domainName || "我的知识库"
    };
    state.custom.push(card);
    save();
    buildIndex();
    return card;
  }

  function updateCard(id, data) {
    var c = state.custom.find(function (x) { return x.id === id; });
    if (!c) return null;
    c.f = data.f; c.b = data.b || ""; c.t = data.t || "";
    if (data.deckId) { c.deckId = data.deckId; c.domainId = data.domainId; c.domainName = data.domainName; }
    save();
    buildIndex();
    return c;
  }

  function deleteCard(id) {
    state.custom = state.custom.filter(function (x) { return x.id !== id; });
    delete state.progress[id];
    save();
    buildIndex();
  }

  function addDeck(domainId, name, domainName) {
    var deck = { id: uid("d"), domainId: domainId, name: name, desc: "", domainName: domainName || "我的知识库" };
    state.customDecks.push(deck);
    save();
    buildIndex();
    return deck;
  }

  function deleteDeck(deckId) {
    state.customDecks = state.customDecks.filter(function (d) { return d.id !== deckId; });
    var removed = state.custom.filter(function (c) { return c.deckId === deckId; });
    removed.forEach(function (c) { delete state.progress[c.id]; });
    state.custom = state.custom.filter(function (c) { return c.deckId !== deckId; });
    save();
    buildIndex();
  }

  function addDomain(name, icon) {
    var id = uid("dom");
    state.customDomains.push({ id: id, name: name, icon: icon || "MY" });
    state.customDecks.push({ id: uid("d"), domainId: id, name: "默认分组", desc: "", domainName: name });
    save();
    buildIndex();
    if (state.settings) state.settings.activeDomain = id;
    save();
    return { id: id, name: name, icon: icon || "MY" };
  }

  function deleteDomain(domainId) {
    var removed = state.custom.filter(function (c) { return c.domainId === domainId; });
    removed.forEach(function (c) { delete state.progress[c.id]; });
    state.custom = state.custom.filter(function (c) { return c.domainId !== domainId; });
    state.customDecks = state.customDecks.filter(function (d) { return d.domainId !== domainId; });
    state.customDomains = state.customDomains.filter(function (d) { return d.id !== domainId; });
    save();
    buildIndex();
  }

  /* ---------- 导入导出 ---------- */
  function exportJSON() {
    return JSON.stringify({
      app: "learn-app", version: 1, exportedAt: new Date().toISOString(),
      settings: state.settings, progress: state.progress, stats: state.stats,
      customDomains: state.customDomains, customDecks: state.customDecks, custom: state.custom
    }, null, 2);
  }

  function exportMarkdown() {
    var lines = ["# 我的知识库导出", "", "> 导出时间：" + new Date().toLocaleString(), ""];
    var group = {};
    state.custom.forEach(function (c) {
      var deck = (index.decks.find(function (d) { return d.id === c.deckId; }) || {});
      var title = (c.domainName || "我的知识库") + " / " + (deck.name || "未分组");
      if (!group[title]) group[title] = [];
      group[title].push(c);
    });
    Object.keys(group).forEach(function (title) {
      lines.push("## " + title, "");
      group[title].forEach(function (c) {
        lines.push("### " + c.f);
        lines.push(c.b || "");
        if (c.t) lines.push("> " + c.t);
        lines.push("");
      });
    });
    return lines.join("\n");
  }

  // 解析：Markdown（## 分组 / ### 正面 / 正文背面 / > 补充）或 CSV（front,back,tip）
  function parseImport(text) {
    var trimmed = (text || "").trim();
    if (!trimmed) return { decks: [], format: "empty" };
    if (trimmed[0] === "{" || trimmed[0] === "[") {
      try {
        var j = JSON.parse(trimmed);
        return { format: "json", json: j };
      } catch (e) { /* 继续当文本处理 */ }
    }
    var lines = trimmed.split(/\r?\n/);
    var decks = [];
    var cur = null;
    var mode = null;
    // 判断是否 CSV/TSV
    var first = lines[0] || "";
    var isCSV = /^(front|正面|q|question)?[,;\t]?(back|背面|a|answer)?[,;\t]/i.test(first) || (first.split(/[,;\t]/).length >= 2 && !/^#{1,3}\s/.test(first) && !/^###?\s/.test(first));
    if (isCSV) {
      var sep = first.indexOf("\t") >= 0 ? "\t" : (first.indexOf(";") >= 0 ? ";" : ",");
      var start = 0;
      if (/front|正面|question/i.test(first.split(sep)[0])) start = 1; // 跳过表头
      for (var i = start; i < lines.length; i++) {
        var parts = lines[i].split(sep);
        if (!parts[0] || !parts[0].trim()) continue;
        pushCard("导入分组", { f: unq(parts[0]), b: unq(parts[1] || ""), t: unq(parts[2] || "") });
      }
      return { format: "csv", decks: decks };
    }
    // Markdown
    for (var j = 0; j < lines.length; j++) {
      var ln = lines[j];
      if (/^##\s+/.test(ln)) {
        cur = { name: ln.replace(/^##\s+/, "").trim(), cards: [] };
        decks.push(cur);
        mode = null;
      } else if (/^###\s+/.test(ln)) {
        if (!cur) { cur = { name: "导入分组", cards: [] }; decks.push(cur); }
        mode = { f: ln.replace(/^###\s+/, "").trim(), b: "", t: "" };
        cur.cards.push(mode);
      } else if (/^>\s?/.test(ln)) {
        if (mode) mode.t += (mode.t ? " " : "") + ln.replace(/^>\s?/, "");
      } else if (ln.trim()) {
        if (mode) mode.b += (mode.b ? "\n" : "") + ln.trim();
      }
    }
    if (!decks.length) return { format: "unknown", decks: [] };
    return { format: "markdown", decks: decks };

    function pushCard(name, card) {
      var d = decks.find(function (x) { return x.name === name; });
      if (!d) { d = { name: name, cards: [] }; decks.push(d); }
      d.cards.push(card);
    }
    function unq(s) {
      s = (s || "").trim();
      if (s.length > 1 && ((s[0] === '"' && s[s.length - 1] === '"') || (s[0] === "'" && s[s.length - 1] === "'"))) s = s.slice(1, -1);
      return s;
    }
  }

  // 把解析结果写入（返回新增数量）
  function importParsed(parsed, target) {
    var added = 0, merged = 0;
    if (parsed.format === "json" && parsed.json) {
      var j = parsed.json;
      if (j.custom) state.custom = j.custom.concat(state.custom.filter(function (c) { return !j.custom.some(function (x) { return x.id === c.id; }); }));
      if (j.customDomains) state.customDomains = j.customDomains.concat(state.customDomains.filter(function (c) { return !j.customDomains.some(function (x) { return x.id === c.id; }); }));
      if (j.customDecks) state.customDecks = j.customDecks.concat(state.customDecks.filter(function (c) { return !j.customDecks.some(function (x) { return x.id === c.id; }); }));
      if (j.progress) Object.keys(j.progress).forEach(function (k) { if (!state.progress[k]) state.progress[k] = j.progress[k]; });
      if (j.stats) Object.keys(j.stats).forEach(function (k) {
        var a = state.stats[k] || { n: 0, rv: 0, ms: 0 }, b = j.stats[k];
        state.stats[k] = { n: Math.max(a.n, b.n || 0), rv: Math.max(a.rv, b.rv || 0), ms: Math.max(a.ms, b.ms || 0) };
      });
      save(); buildIndex();
      return { added: (j.custom || []).length, merged: 0 };
    }
    var domainId = target.domainId, domainName = target.domainName;
    parsed.decks.forEach(function (d) {
      var deck = state.customDecks.find(function (x) { return x.domainId === domainId && x.name === d.name; });
      if (!deck) deck = addDeck(domainId, d.name, domainName);
      d.cards.forEach(function (c) {
        if (!c.f) return;
        var exist = state.custom.find(function (x) { return x.deckId === deck.id && x.f === c.f; });
        if (exist) { exist.b = c.b; exist.t = c.t; merged++; }
        else { state.custom.push({ id: uid("c"), f: c.f, b: c.b || "", t: c.t || "", deckId: deck.id, domainId: domainId, domainName: domainName }); added++; }
      });
    });
    save(); buildIndex();
    return { added: added, merged: merged };
  }

  function resetAll() {
    state = defaultState();
    save();
    buildIndex();
  }

  function resetProgress() {
    state.progress = {};
    state.stats = {};
    save();
  }

  /* ---------- 搜索 ---------- */
  function search(q) {
    q = (q || "").trim().toLowerCase();
    if (!q) return [];
    return index.cards.filter(function (c) {
      return (c.f + " " + c.b + " " + c.t + " " + c.deckName + " " + c.domainName).toLowerCase().indexOf(q) >= 0;
    }).slice(0, 60);
  }

  window.Store = {
    PATHS: PATHS,
    load: load, save: save,
    get state() { return state; },
    get index() { return index; },
    dayKey: dayKey, todayKey: todayKey,
    getProgress: getProgress, mastery: mastery, review: review, addStudyTime: addStudyTime,
    dueCards: dueCards, newCards: newCards, pathDeckOrder: pathDeckOrder,
    todayStat: todayStat, streak: streak, masteryDist: masteryDist, deckMastery: deckMastery,
    addCard: addCard, updateCard: updateCard, deleteCard: deleteCard,
    addDeck: addDeck, deleteDeck: deleteDeck, addDomain: addDomain, deleteDomain: deleteDomain, uid: uid,
    exportJSON: exportJSON, exportMarkdown: exportMarkdown, parseImport: parseImport, importParsed: importParsed,
    resetAll: resetAll, resetProgress: resetProgress, search: search
  };
})();

</script>
<script>
/* 主应用：页面渲染 / 学习会话 / 知识库编辑 / 导入导出 */
(function () {
  "use strict";
  var S = window.Store;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  var PAGE_META = {
    home: ["学习", "今天也要进步一点点"],
    path: ["学习路径", "跟着阶段走，不迷路"],
    lib: ["知识库", "内置 + 自建，随时可改"],
    stats: ["统计", "看得见的积累"],
    me: ["我的", "设置与数据"]
  };

  var curPage = "home";
  var libState = { domainId: "all", deckId: null, q: "" };
  var statDomain = "all";
  var pathDomain = "english";
  var homeDomain = null; // null 表示跟随 settings.activeDomain

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function toast(msg) {
    var t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function () { t.remove(); }, 2000);
  }
  function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }
  function mins(ms) { return Math.max(1, Math.round((ms || 0) / 60000)); }
  function domainName(id) {
    var d = S.index.domains.find(function (x) { return x.id === id; });
    return d ? d.name : "我的知识库";
  }
  function accentOf(id) {
    var d = S.index.domains.find(function (x) { return x.id === id; });
    return (d && d.accent) || "#F5A524";
  }
  function uidOf(prefix) { return S.uid(prefix); }

  /* ---------- 路由 ---------- */
  function go(page) {
    curPage = page;
    ["home", "path", "lib", "stats", "me"].forEach(function (p) {
      $("#page-" + p).classList.toggle("hidden", p !== page);
    });
    $$(".tabbar button").forEach(function (b) { b.classList.toggle("on", b.dataset.page === page); });
    $("#pageTitle").textContent = PAGE_META[page][0];
    $("#pageSub").textContent = PAGE_META[page][1];
    $("#btnSearch").classList.toggle("hidden", page === "me");
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (curPage === "home") renderHome();
    else if (curPage === "path") renderPath();
    else if (curPage === "lib") renderLib();
    else if (curPage === "stats") renderStats();
    else renderMe();
  }

  /* ---------- 领域 chips ---------- */
  function domainChips(active, includeAll) {
    var out = "";
    if (includeAll) out += '<button class="chip' + (active === "all" ? " on" : "") + '" data-dom="all">全部</button>';
    S.index.domains.forEach(function (d) {
      out += '<button class="chip' + (active === d.id ? " on" : "") + '" data-dom="' + esc(d.id) + '">' + esc(d.name) + '</button>';
    });
    return '<div class="chips">' + out + "</div>";
  }
  function bindChips(root, cb) {
    $$(".chip[data-dom]", root).forEach(function (b) {
      b.onclick = function () { cb(b.dataset.dom); };
    });
  }

  /* ================= 首页 ================= */
  function activeHomeDomain() {
    return homeDomain || S.state.settings.activeDomain || "english";
  }

  function queueFor(domainId) {
    var did = domainId === "all" ? null : domainId;
    var due = S.dueCards(S.state.settings.dailyReview).filter(function (c) { return !did || c.domainId === did; });
    var fresh = S.newCards(did, S.state.settings.dailyNew);
    return { due: due, fresh: fresh, all: due.concat(fresh) };
  }

  function renderHome() {
    var dom = activeHomeDomain();
    var q = queueFor(dom);
    var st = S.todayStat();
    var streak = S.streak();
    var goal = S.state.settings.dailyNew;
    var dist = S.masteryDist(dom === "all" ? null : dom);
    var total = dist.reduce(function (a, b) { return a + b; }, 0);

    var html = "";
    html += '<div class="hero">' +
      '<div class="big">' + greet() + '</div>' +
      '<div class="goal">' + (dom === "all" ? "全部领域" : esc(domainName(dom))) + ' · 今日目标 ' + goal + ' 张新卡</div>' +
      '<div class="rings">' +
      '<div class="ring"><div class="num">' + q.due.length + '</div><div class="lb">待复习</div></div>' +
      '<div class="ring"><div class="num">' + q.fresh.length + '</div><div class="lb">可新学</div></div>' +
      '<div class="ring"><div class="num">' + streak + '</div><div class="lb">连续天数</div></div>' +
      '</div>' +
      '<div class="mt12"><div class="bar"><i style="width:' + pct(st.n, Math.max(1, goal)) + '%"></i></div>' +
      '<div class="tiny faint mt8">今日已新学 ' + st.n + ' / ' + goal + ' 张 · 复习 ' + st.rv + ' 张' + (st.ms ? ' · 用时约 ' + mins(st.ms) + ' 分钟' : '') + '</div></div>' +
      '</div>';

    html += domainChips(dom, true);

    html += '<button class="btn primary wide" id="btnStart"' + (q.all.length ? "" : " disabled") + '>' +
      (q.all.length ? "开始学习 · " + q.all.length + " 张" : "今日任务已完成 🎉") + '</button>';

    html += '<div class="mt16">';
    html += taskRow("🔁", "复习到期", q.due.length + " 张待复习", q.due.length ? "review" : null);
    html += taskRow("✨", "学习新卡", q.fresh.length + " 张可新学（上限 " + goal + "）", q.fresh.length ? "new" : null);
    html += taskRow("📈", "掌握进度", "已接触 " + (total - dist[0]) + " / " + total + " 张", null);
    html += "</div>";

    // 推荐分组
    var decks = S.index.decks.filter(function (d) { return dom === "all" || d.domainId === dom; })
      .map(function (d) { return { d: d, m: S.deckMastery(d.id) }; })
      .filter(function (x) { return x.m.learned < x.m.total; })
      .sort(function (a, b) { return b.m.pct - a.m.pct; }).slice(0, 3);
    if (decks.length) {
      html += '<div class="small muted mt16" style="margin-bottom:8px">继续学习</div>';
      decks.forEach(function (x) {
        html += '<div class="task" data-deck="' + esc(x.d.id) + '">' +
          '<div class="t-ic" style="background:color-mix(in srgb,' + accentOf(x.d.domainId) + ' 18%, var(--surface-2))">' + (x.d.builtin ? "📘" : "✍️") + '</div>' +
          '<div class="grow"><div class="t-title">' + esc(x.d.name) + '</div>' +
          '<div class="t-sub">' + esc(x.d.domainName) + ' · 已学 ' + x.m.pct + '%</div></div>' +
          '<div class="bar" style="width:60px"><i style="width:' + x.m.pct + '%"></i></div></div>';
      });
    }

    var host = $("#page-home");
    host.innerHTML = html;
    bindChips(host, function (id) { homeDomain = id; S.state.settings.activeDomain = id === "all" ? "english" : id; S.save(); renderHome(); });
    var bs = $("#btnStart", host);
    if (bs) bs.onclick = function () { startStudy(q.all, "今日学习 · " + (dom === "all" ? "全部" : domainName(dom))); };
    $$(".task[data-act]", host).forEach(function (b) {
      b.onclick = function () {
        var act = b.dataset.act;
        startStudy(act === "review" ? q.due : q.fresh, act === "review" ? "复习到期" : "学习新卡");
      };
    });
    $$(".task[data-deck]", host).forEach(function (b) {
      b.onclick = function () { libState.domainId = "all"; libState.deckId = b.dataset.deck; go("lib"); };
    });
  }

  function greet() {
    var h = new Date().getHours();
    if (h < 6) return "夜深了，学一点就好";
    if (h < 11) return "早上好，开始今天";
    if (h < 14) return "中午好，来一轮";
    if (h < 18) return "下午好，继续推进";
    return "晚上好，收个尾";
  }

  function taskRow(em, title, sub, act) {
    return '<div class="task"' + (act ? ' data-act="' + act + '"' : '') + '>' +
      '<div class="t-ic">' + em + '</div>' +
      '<div class="grow"><div class="t-title">' + title + '</div><div class="t-sub">' + sub + '</div></div>' +
      (act ? '<span class="badge">开始 ›</span>' : '') + '</div>';
  }

  /* ================= 路径 ================= */
  function renderPath() {
    var dom = pathDomain;
    var stages = S.PATHS[dom] || [];
    var html = domainChips(dom, false);
    if (!stages.length) {
      html += '<div class="empty"><div class="em">🧭</div>这个领域还没有内置学习路径<br><span class="small">可在知识库里自建分组来组织内容</span></div>';
      var host0 = $("#page-path");
      host0.innerHTML = html;
      bindChips(host0, function (id) { pathDomain = id; renderPath(); });
      return;
    }
    var order = S.pathDeckOrder(dom);
    stages.forEach(function (st, si) {
      var dm = st.decks.map(function (id) { return S.deckMastery(id); });
      var learned = dm.reduce(function (a, b) { return a + b.learned; }, 0);
      var total = dm.reduce(function (a, b) { return a + b.total; }, 0);
      var p = pct(learned, total);
      var cards = [];
      st.decks.forEach(function (id) { cards = cards.concat(S.index.byDeck[id] || []); });
      var pending = cards.filter(function (c) { var pr = S.getProgress(c.id); return !pr || pr.due <= Date.now(); });
      html += '<div class="stage' + (p === 100 ? " done" : "") + '">' +
        '<div class="st-head"><div class="st-name">' + esc(st.name) + '</div>' +
        '<span class="badge">' + learned + "/" + total + '</span></div>' +
        '<div class="st-goal">' + esc(st.goal) + '</div>' +
        '<div class="bar"><i style="width:' + p + '%"></i></div>' +
        '<div class="decks mt12">' +
        st.decks.map(function (id) {
          var d = S.index.decks.find(function (x) { return x.id === id; }) || { name: id };
          var m = S.deckMastery(id);
          return '<div class="deck-line" data-deck="' + esc(id) + '">' +
            '<span class="nm">' + esc(d.name) + '</span>' +
            '<div class="bar"><i style="width:' + m.pct + '%"></i></div>' +
            '<span class="pc">' + m.pct + '%</span></div>';
        }).join("") +
        '</div>' +
        '<button class="btn wide mt12" data-study="' + si + '"' + (pending.length ? "" : " disabled") + '>' +
        (pending.length ? "学习本阶段 · " + pending.length + " 张" : "本阶段已排满复习 ✓") + '</button>' +
        '</div>';
    });
    var host = $("#page-path");
    host.innerHTML = html;
    bindChips(host, function (id) { pathDomain = id; renderPath(); });
    $$("[data-study]", host).forEach(function (b) {
      b.onclick = function () {
        var st = stages[+b.dataset.study];
        var cards = [];
        st.decks.forEach(function (id) { cards = cards.concat(S.index.byDeck[id] || []); });
        cards = cards.filter(function (c) { var pr = S.getProgress(c.id); return !pr || pr.due <= Date.now(); });
        // 复习优先
        cards.sort(function (a, b2) {
          var pa = S.getProgress(a.id) ? 1 : 0, pb = S.getProgress(b2.id) ? 1 : 0;
          return pb - pa;
        });
        startStudy(cards, st.name);
      };
    });
    $$("[data-deck]", host).forEach(function (b) {
      b.onclick = function () { libState.domainId = dom; libState.deckId = b.dataset.deck; go("lib"); };
    });
  }

  /* ================= 知识库 ================= */
  function renderLib() {
    var host = $("#page-lib");
    var html = "";

    if (libState.deckId) {
      var deck = S.index.decks.find(function (d) { return d.id === libState.deckId; });
      if (!deck) { libState.deckId = null; return renderLib(); }
      var cards = (S.index.byDeck[deck.id] || []).slice();
      var m = S.deckMastery(deck.id);
      html += '<div class="row" style="margin-bottom:10px"><button class="btn ghost" id="btnBack">‹ 返回</button>' +
        '<div style="flex:1" class="small muted">' + esc(deck.domainName) + ' · ' + cards.length + ' 张 · 已学 ' + m.pct + '%</div></div>';
      html += '<div class="bar" style="margin-bottom:12px"><i style="width:' + m.pct + '%"></i></div>';
      html += '<div class="row" style="gap:8px;margin-bottom:12px">' +
        '<button class="btn" style="flex:1" id="btnStudyDeck">学习本组</button>' +
        (deck.builtin ? '' : '<button class="btn danger" id="btnDelDeck">删除分组</button>') + '</div>';
      if (libState.q) cards = cards.filter(function (c) { return (c.f + c.b).toLowerCase().indexOf(libState.q.toLowerCase()) >= 0; });
      if (!cards.length) html += '<div class="empty"><div class="em">🗂</div>这里还没有卡片</div>';
      cards.forEach(function (c) {
        var mv = S.mastery(c.id);
        var label = ["未学", "学习中", "巩固中", "已掌握"][mv];
        html += '<div class="kb-card">' +
          '<div class="between"><div class="row"><span class="dot m' + mv + '"></span><span class="q">' + esc(c.f) + '</span></div>' +
          '<span class="tiny faint">' + label + (c.builtin ? "" : ' · 自建') + '</span></div>' +
          (c.b ? '<div class="a">' + esc(c.b) + '</div>' : '') +
          (c.t ? '<div class="ex">' + esc(c.t) + '</div>' : '') +
          (c.builtin ? '' : '<div class="row mt12" style="gap:8px;justify-content:flex-end">' +
            '<button class="btn ghost small" data-edit="' + esc(c.id) + '">编辑</button>' +
            '<button class="btn ghost small" data-del="' + esc(c.id) + '" style="color:var(--bad)">删除</button></div>') +
          '</div>';
      });
      host.innerHTML = html;
      $("#btnBack", host).onclick = function () { libState.deckId = null; renderLib(); };
      $("#btnStudyDeck", host).onclick = function () {
        var list = (S.index.byDeck[deck.id] || []).filter(function (c) { var p = S.getProgress(c.id); return !p || p.due <= Date.now(); });
        if (!list.length) list = (S.index.byDeck[deck.id] || []).slice();
        startStudy(list, deck.name);
      };
      var bd = $("#btnDelDeck", host);
      if (bd) bd.onclick = function () {
        if (confirm("删除分组「" + deck.name + "」及其所有卡片？")) { S.deleteDeck(deck.id); libState.deckId = null; toast("已删除"); renderLib(); }
      };
      $$("[data-edit]", host).forEach(function (b) { b.onclick = function () { openCardEditor(b.dataset.edit); }; });
      $$("[data-del]", host).forEach(function (b) {
        b.onclick = function () {
          if (confirm("删除这张卡片？")) { S.deleteCard(b.dataset.del); toast("已删除"); renderLib(); }
        };
      });
      return;
    }

    html += '<input class="search" id="kbSearch" placeholder="搜索关键词（正面 / 背面 / 分组）" value="' + esc(libState.q) + '">';
    html += domainChips(libState.domainId, true);

    if (libState.q.trim()) {
      var res = S.search(libState.q).filter(function (c) { return libState.domainId === "all" || c.domainId === libState.domainId; });
      html += '<div class="small muted" style="margin:4px 0 10px">找到 ' + res.length + ' 条</div>';
      if (!res.length) html += '<div class="empty"><div class="em">🔍</div>没有匹配的卡片</div>';
      res.forEach(function (c) {
        html += '<div class="kb-card" data-godeck="' + esc(c.deckId) + '">' +
          '<div class="between"><span class="q">' + esc(c.f) + '</span><span class="tiny faint">' + esc(c.deckName) + '</span></div>' +
          '<div class="a">' + esc(c.b) + '</div>' + (c.t ? '<div class="ex">' + esc(c.t) + '</div>' : '') + '</div>';
      });

      bindSearch(host);

    }

    var decks = S.index.decks.filter(function (d) { return libState.domainId === "all" || d.domainId === libState.domainId; });

  /* ================= 统计 ================= */
  function renderStats() {
    var did = statDomain === "all" ? null : statDomain;
    var dist = S.masteryDist(did);
    var total = dist.reduce(function (a, b) { return a + b; }, 0);
    var st = S.todayStat();
    var streak = S.streak();
    var sumDays = Object.keys(S.state.stats).filter(function (k) { var v = S.state.stats[k]; return (v.n + v.rv) > 0; }).length;

    var html = domainChips(statDomain, true);
    html += '<div class="grid2">' +
      '<div class="stat-mini"><div class="n" style="color:var(--gold)">' + streak + '</div><div class="l">连续打卡（天）</div></div>' +
      '<div class="stat-mini"><div class="n">' + (st.n + st.rv) + '</div><div class="l">今日学习（张）</div></div>' +
      '<div class="stat-mini"><div class="n">' + sumDays + '</div><div class="l">累计学习（天）</div></div>' +
      '<div class="stat-mini"><div class="n">' + (total - dist[0]) + '</div><div class="l">已接触（张）</div></div>' +
      '</div>';

    // 热力图
    html += '<div class="card mt16"><div class="between"><b>学习热力图</b><span class="tiny faint">近 12 周</span></div>' +
      '<div class="heat mt12">' + heatCells() + '</div>' +
      '<div class="legend"><span><b style="background:var(--surface-2)"></b>未学习</span>' +
      '<span><b style="background:color-mix(in srgb,var(--accent) 30%,var(--surface-2))"></b>少量</span>' +
      '<span><b style="background:var(--accent)"></b>达标</span>' +
      '<span><b style="background:var(--accent-2)"></b>超额</span></div></div>';

    // 近 14 天
    html += '<div class="card"><div class="between"><b>近 14 天学习量</b><span class="tiny faint">张 / 天</span></div>' +
      '<div class="chart">' + bars14() + '</div></div>';

    // 掌握度
    var labels = ["未学习", "学习中", "巩固中", "已掌握"];
    var colors = ["var(--faint)", "var(--bad)", "var(--warn)", "var(--ok)"];
    html += '<div class="card"><div class="between"><b>掌握度分布</b><span class="tiny faint">共 ' + total + ' 张</span></div>' +
      '<div class="mt12" style="display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--surface-2)">' +
      dist.map(function (n, i) { return '<i style="width:' + pct(n, total) + '%;background:' + colors[i] + '"></i>'; }).join("") +
      '</div><div class="legend">' +
      dist.map(function (n, i) { return '<span><b style="background:' + colors[i] + '"></b>' + labels[i] + ' ' + n + '</span>'; }).join("") +
      '</div></div>';

    // 分组掌握度
    var decks = S.index.decks.filter(function (d) { return !did || d.domainId === did; })
      .map(function (d) { return { d: d, m: S.deckMastery(d.id) }; })
      .sort(function (a, b) { return b.m.pct - a.m.pct; });
    if (decks.length) {
      html += '<div class="card"><b>分组掌握度</b><div class="mt12">' +
        decks.map(function (x) {
          return '<div class="deck-line" style="margin-bottom:9px"><span class="nm">' + esc(x.d.name) + '</span>' +
            '<div class="bar" style="flex:1"><i style="width:' + x.m.pct + '%"></i></div>' +
            '<span class="pc">' + x.m.pct + '%</span></div>';
        }).join("") + '</div></div>';
    }

    var host = $("#page-stats");
    host.innerHTML = html;
    bindChips(host, function (id) { statDomain = id; renderStats(); });
  }

  function heatCells() {
    var out = "";
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var start = new Date(today);
    start.setDate(start.getDate() - (today.getDay() + 77)); // 回到 11 周前的周日
    var d = new Date(start);
    for (var i = 0; i < 84; i++) {
      var k = S.dayKey(d.getTime());
      var v = S.state.stats[k];
      var n = v ? (v.n + v.rv) : 0;
      var lv = n === 0 ? 0 : n < 5 ? 1 : n < 15 ? 2 : n < 30 ? 3 : 4;
      var future = d > today;
      out += '<i class="' + (lv ? "l" + lv : "") + '" title="' + k + " · " + n + ' 张"' +
        (future ? ' style="opacity:.3"' : '') + '></i>';
      d.setDate(d.getDate() + 1);
    }
    return out;
  }

  function bars14() {
    var out = "";
    var d = new Date();
    for (var i = 13; i >= 0; i--) {
      var dd = new Date(); dd.setDate(d.getDate() - i);
      var k = S.dayKey(dd.getTime());
      var v = S.state.stats[k];
      var n = v ? (v.n + v.rv) : 0;
      var max = 1;
      for (var j = 0; j < 14; j++) {
        var t2 = new Date(); t2.setDate(d.getDate() - j);
        var v2 = S.state.stats[S.dayKey(t2.getTime())];
        if (v2) max = Math.max(max, v2.n + v2.rv);
      }
      out += '<div class="col" title="' + k + " · " + n + '"><i style="height:' + Math.max(3, Math.round((n / max) * 84)) + 'px"></i>' +
        '<span>' + (dd.getMonth() + 1) + "/" + dd.getDate() + '</span></div>';
    }
    return out;
  }

  function setTheme(t) {
    S.state.settings.theme = t;
    document.documentElement.dataset.theme = t;
